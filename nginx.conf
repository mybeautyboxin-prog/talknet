# =================================================
# TalkNet — Nginx reverse proxy
# =================================================
# Serves the React SPA (frontend service) and proxies
# /api/* to the FastAPI backend service.

upstream talknet_backend {
    server backend:8001;
    keepalive 32;
}

upstream talknet_frontend {
    server frontend:80;
    keepalive 16;
}

# ---- HTTP → HTTPS redirect (enable once you drop certs into ./certs) ----
# server {
#     listen 80;
#     server_name YOUR_DOMAIN;
#     return 301 https://$host$request_uri;
# }

# ---- HTTPS ----
server {
    listen 80 default_server;
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    server_name _;
    client_max_body_size 250M;    # LiveKit-composite recordings can be big
    proxy_read_timeout   3600s;   # long-lived polling
    proxy_send_timeout   3600s;

    # ---- Backend API ----
    location /api/ {
        proxy_pass         http://talknet_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ---- WebSocket upgrades (for future websocket endpoints if any) ----
    location /ws/ {
        proxy_pass         http://talknet_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ---- Frontend SPA (React) ----
    location / {
        proxy_pass         http://talknet_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
