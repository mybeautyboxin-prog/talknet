# TalkNet — production docker-compose stack
# Deploy with:  docker compose --env-file .env up -d --build
#
# Ports exposed on the host:
#   80  — Nginx reverse proxy (frontend + /api → backend)
#   443 — Nginx TLS (attach your certs via ./certs volume)
#
# Everything internal is on the "talknet" private network.

services:
  # -------- Reverse proxy: frontend + /api routing + TLS --------
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/talknet.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [talknet]

  # -------- Frontend (React SPA served by nginx) --------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_BASE_URL}
    restart: unless-stopped
    expose: ["80"]
    networks: [talknet]

  # -------- Backend (FastAPI) --------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-talknet}
      CORS_ORIGINS: ${PUBLIC_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      REDIS_URL: redis://redis:6379/0
      RECORDINGS_DIR: /app/recordings
      FRONTEND_URL: ${PUBLIC_BASE_URL}
    volumes:
      - recordings:/app/recordings
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    expose: ["8001"]
    networks: [talknet]

  # -------- MongoDB (primary datastore) --------
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--bind_ip_all", "--quiet", "--logpath", "/dev/null"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 15s
    expose: ["27017"]
    networks: [talknet]

  # -------- Redis (rate-limit, session cache, future queue) --------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose: ["6379"]
    networks: [talknet]

  # -------- (Optional) PostgreSQL ---------------------------------
  # Included for future migration off MongoDB. Not currently wired
  # into the backend. Uncomment when adopting Prisma / SQLAlchemy.
  #
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-talknet}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB:-talknet}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   expose: ["5432"]
  #   networks: [talknet]

  # -------- (Optional) LiveKit self-hosted server -----------------
  # Only enable if you do NOT use LiveKit Cloud. Requires public UDP
  # range 50000-60000 open on the host + a TURN server for NATs.
  # Copy livekit.example.yaml → livekit.yaml, populate keys, then:
  #
  # livekit:
  #   image: livekit/livekit-server:v1.7
  #   restart: unless-stopped
  #   command: --config /etc/livekit.yaml
  #   volumes:
  #     - ./livekit.yaml:/etc/livekit.yaml:ro
  #   network_mode: host

volumes:
  mongo_data:
  redis_data:
  recordings:
  # postgres_data:

networks:
  talknet:
    driver: bridge
